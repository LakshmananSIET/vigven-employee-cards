<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee QR | Vigven</title><link rel="stylesheet" href="styles.css"></head><body><main class="page"><section class="business-card"><div class="card-top"><div class="logo">VIGVEN</div><div class="profile"><div class="initials">QR</div><div><h1 class="name">Employee QR</h1><p class="designation">Permanent digital card link</p></div></div></div><div class="card-body"><div id="status" class="muted">Loading…</div><div id="qr" class="qr-box"></div><button id="download" class="btn primary" style="width:100%" disabled>Download QR</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>(async()=>{const base=location.pathname.slice(0,location.pathname.lastIndexOf('/')+1);const id=new URLSearchParams(location.search).get('id');const status=document.getElementById('status'),qr=document.getElementById('qr'),btn=document.getElementById('download');try{if(!id)throw Error('Missing employee ID');const r=await fetch(base+'employees.json?x='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Employee data not found');const rows=await r.json();const e=rows.find(x=>String(x.id||'').trim().toLowerCase()===id.trim().toLowerCase());if(!e)throw Error('Employee not found');const url=new URL('card.html?id='+encodeURIComponent(e.id),location.href).href;status.innerHTML='<strong>'+String(e.employeeName||e.employeename||e.id)+'</strong>';const canvas=document.createElement('canvas');await QRCode.toCanvas(canvas,url,{width:280,margin:2});qr.appendChild(canvas);btn.disabled=false;btn.onclick=()=>{const a=document.createElement('a');a.download=(e.employeeName||e.id)+'-QR.png';a.href=canvas.toDataURL('image/png');a.click()}}catch(err){status.textContent=err.message}})();</script></body></html>
