name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert employees.xlsx to employees.json
        run: |
          python -m pip install openpyxl
          python - <<'PY'
          import json
          from datetime import date, datetime
          from openpyxl import load_workbook

          wb = load_workbook('employees.xlsx', data_only=True, read_only=True)
          ws = wb[wb.sheetnames[0]]
          rows = list(ws.iter_rows(values_only=True))
          if not rows:
              raise SystemExit('employees.xlsx is empty')

          headers = [str(x).strip() if x is not None else '' for x in rows[0]]
          data = []
          for values in rows[1:]:
              item = {}
              for i, header in enumerate(headers):
                  if not header:
                      continue
                  value = values[i] if i < len(values) else ''
                  if isinstance(value, (datetime, date)):
                      value = value.isoformat()
                  item[header] = '' if value is None else value
              if str(item.get('id', '')).strip():
                  data.append(item)

          with open('employees.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(f'Generated employees.json with {len(data)} employees')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
